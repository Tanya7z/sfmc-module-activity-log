name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "已提交到 package.json 的版本"
        required: true
        type: string
      dry_run:
        description: "仅验证并上传包产物"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: 校验发布版本
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p=require("./package.json");if(p.version!==process.env.EXPECTED_VERSION||!/^\d+\.\d+\.\d+$/.test(p.version)){throw new Error("发布版本须与 package.json 一致，且为正式 semver")}'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: 打包候选产物
        run: mkdir -p artifacts && pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: module-${{ inputs.version }}
          path: artifacts/*.tgz
          retention-days: 14
      - name: 发布到 npm
        if: inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN 未配置，无法用 pnpm 发布"
            exit 1
          fi
          pnpm publish --access public --provenance --no-git-checks
      - name: 创建版本标签与 Release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --generate-notes
